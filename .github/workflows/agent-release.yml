name: Agent Release

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whether this version is out
        id: version
        working-directory: agent
        run: |
          tag="agent-v$(tr -d '[:space:]' < VERSION)"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists. Bump agent/VERSION to cut a new release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.released == 'false'
    environment: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "agent/VERSION is '$version', which is not MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          tag="agent-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already exists. Bump agent/VERSION to cut a new release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.released == 'false'
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.mod

      - name: Test
        if: steps.version.outputs.released == 'false'
        run: go test ./...

      - name: Build Linux binaries
        if: steps.version.outputs.released == 'false'
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o krynodes-linux-amd64 ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o krynodes-linux-arm64 ./cmd/agent
          sha256sum krynodes-linux-amd64 > krynodes-linux-amd64.sha256
          sha256sum krynodes-linux-arm64 > krynodes-linux-arm64.sha256

      - name: Verify the binary reports its version
        if: steps.version.outputs.released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          reported="$(./krynodes-linux-amd64 version)"
          if [ "$reported" != "$VERSION" ]; then
            echo "Binary reports '${reported}' but VERSION says '${VERSION}'." >&2
            exit 1
          fi

      - name: Sign the binaries
        if: steps.version.outputs.released == 'false'
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          if [ -z "$AGENT_SIGNING_KEY" ]; then
            echo "Set the AGENT_SIGNING_KEY secret: agents only install signed releases." >&2
            exit 1
          fi
          key="$RUNNER_TEMP/agent-signing-key.pem"
          printf '%s\n' "$AGENT_SIGNING_KEY" > "$key"
          derived="$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64)"
          if [ "$derived" != "$(tr -d '[:space:]' < internal/update/release.pub)" ]; then
            rm -f "$key"
            echo "AGENT_SIGNING_KEY does not match agent/internal/update/release.pub." >&2
            exit 1
          fi
          for file in krynodes-linux-amd64 krynodes-linux-arm64; do
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$file" -out "$file.sig"
          done
          rm -f "$key"

      - name: Compress the binaries for slow links
        if: steps.version.outputs.released == 'false'
        run: gzip -9 -n -k krynodes-linux-amd64 krynodes-linux-arm64

      - name: Attest amd64 binary
        if: steps.version.outputs.released == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: agent/krynodes-linux-amd64

      - name: Attest arm64 binary
        if: steps.version.outputs.released == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: agent/krynodes-linux-arm64

      - name: Tag the release
        if: steps.version.outputs.released == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Krynodes Agent $TAG"
          git push origin "$TAG"

      - name: Publish release
        if: steps.version.outputs.released == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Krynodes Agent ${{ steps.version.outputs.version }}
          draft: true
          files: |
            agent/krynodes-linux-amd64.gz
            agent/krynodes-linux-arm64.gz
            agent/krynodes-linux-amd64
            agent/krynodes-linux-amd64.sha256
            agent/krynodes-linux-amd64.sig
            agent/krynodes-linux-arm64
            agent/krynodes-linux-arm64.sha256
            agent/krynodes-linux-arm64.sig

      - name: Publish the release once every file is uploaded
        if: steps.version.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
